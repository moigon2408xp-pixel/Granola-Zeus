<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Granola Zeus – Control de Producción & Pedidos</title>
  
  <meta name="theme-color" content="#d97706">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Granola Zeus">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥣</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand-area">
        <span class="brand-icon">🥣</span>
        <div class="brand-text">
          <h1 class="brand-title">GRANOLA ZEUS <span class="brand-lightning">⚡</span></h1>
          <p class="brand-sub">Producción & Despacho Artesanal</p>
        </div>
      </div>
      
      <div class="top-actions">
        <button id="btn-guide" class="icon-btn-pill" title="Guía de uso">🎓 Guía</button>
        <button id="btn-refresh" class="icon-btn" title="Sincronizar">↻</button>
        <button id="btn-theme" class="icon-btn" title="Modo Oscuro / Claro">🌙</button>
        <div id="user-badge" class="user-badge" title="Usuario activo">
          <span class="user-avatar">👤</span>
          <span id="user-name-display">Admin Zeus</span>
        </div>
      </div>
    </header>

    <!-- Critical Alerts Banner -->
    <div id="critical-banner-container"></div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <button class="nav-btn active" data-tab="today">
        <span class="nav-icon">⚡</span>
        <span class="nav-label">Hoy</span>
        <span id="badge-today-count" class="nav-count" style="display:none;">0</span>
      </button>
      <button class="nav-btn" data-tab="orders">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Producción</span>
        <span id="badge-orders-count" class="nav-count" style="display:none;">0</span>
      </button>
      <button class="nav-btn" data-tab="new-order">
        <span class="nav-icon">➕</span>
        <span class="nav-label">Nuevo</span>
      </button>
      <button class="nav-btn" data-tab="clients">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Clientes</span>
      </button>
      <button class="nav-btn" data-tab="products">
        <span class="nav-icon">🥣</span>
        <span class="nav-label">Catálogo</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <span class="nav-icon">📦</span>
        <span class="nav-label">Historial</span>
      </button>
      <button class="nav-btn" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Ajustes</span>
      </button>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Cargando datos de Granola Zeus...</p>
      </div>
    </main>
  </div>

  <!-- Global Modal Container -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js?v=1"></script>
</body>
</html>
